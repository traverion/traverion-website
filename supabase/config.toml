# Minimal Supabase CLI config. Link your project with: supabase link --project-ref <ref>

# Gateway JWT verify can return "Invalid JWT" for otherwise valid sessions; the function still
# validates the Bearer token with service role + getUser() and enforces admin role + public.admin.
[functions.admin-supplier-verification]
verify_jwt = false

[functions.notify-staff-verification-queue]
verify_jwt = false
