# Hourly: expire Stay Request-to-Book rows past the 24h approval window.
# Edge: expire-stay-booking-requests (cancels Stripe authorizations + notifies).
#
# Auth: Bearer secret matching Edge Function env.
# Prefer STAY_REQUEST_EXPIRE_SECRET; otherwise reuse BOOKING_REMINDER_CRON_SECRET
# (already configured for send-booking-reminders).

name: Expire stay booking requests

on:
  schedule:
    - cron: '12 * * * *'
  workflow_dispatch:

concurrency:
  group: expire-stay-booking-requests
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  expire:
    name: Call expire-stay-booking-requests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: POST expire-stay-booking-requests
        env:
          STAY_REQUEST_EXPIRE_SECRET: ${{ secrets.STAY_REQUEST_EXPIRE_SECRET }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          BOOKING_REMINDER_CRON_SECRET: ${{ secrets.BOOKING_REMINDER_CRON_SECRET }}
          FUNCTION_URL: https://xcopqllkulxfkpunetbc.supabase.co/functions/v1/expire-stay-booking-requests
        run: |
          set -euo pipefail
          SECRET="${STAY_REQUEST_EXPIRE_SECRET:-${CRON_SECRET:-${BOOKING_REMINDER_CRON_SECRET:-}}}"
          if [ -z "${SECRET}" ]; then
            echo "::error::Set STAY_REQUEST_EXPIRE_SECRET, CRON_SECRET, or BOOKING_REMINDER_CRON_SECRET in GitHub Actions secrets."
            exit 1
          fi

          ATTEMPT=1
          MAX_ATTEMPTS=3
          HTTP_CODE="000"
          while [ "${ATTEMPT}" -le "${MAX_ATTEMPTS}" ]; do
            set +e
            HTTP_CODE="$(curl -sS -o /tmp/expire-stay-response.json -w '%{http_code}' \
              --connect-timeout 15 \
              --max-time 120 \
              -X POST "${FUNCTION_URL}" \
              -H "Authorization: Bearer ${SECRET}" \
              -H "Content-Type: application/json" \
              -d '{}')"
            CURL_EC=$?
            set -e
            echo "Attempt ${ATTEMPT}/${MAX_ATTEMPTS} HTTP status: ${HTTP_CODE} curl_ec=${CURL_EC}"
            cat /tmp/expire-stay-response.json || true
            echo
            case "${HTTP_CODE}" in
              2??)
                echo "expire-stay-booking-requests succeeded."
                exit 0
                ;;
              401|403)
                echo "::error::expire-stay-booking-requests unauthorized (HTTP ${HTTP_CODE})"
                exit 1
                ;;
              000|521|502|503|504)
                ;;
              *)
                echo "::error::expire-stay-booking-requests failed with HTTP ${HTTP_CODE}"
                exit 1
                ;;
            esac
            if [ "${ATTEMPT}" -eq "${MAX_ATTEMPTS}" ]; then
              echo "::error::expire-stay-booking-requests exhausted retries (last HTTP ${HTTP_CODE}, curl_ec=${CURL_EC})"
              exit 1
            fi
            sleep $((ATTEMPT * 20))
            ATTEMPT=$((ATTEMPT + 1))
          done
