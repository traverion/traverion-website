# Every 5 minutes: claim supplier-cancel pending_customer_choice past official
# start, then drain cancel-refund Stripe instructions (Phase 2+3).
#
# Auth: Bearer secret matching Edge Function env.
# Prefer CANCEL_RESOLUTION_CRON_SECRET; otherwise CRON_SECRET or
# BOOKING_REMINDER_CRON_SECRET.

name: Process cancel resolutions

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

concurrency:
  group: process-cancel-resolutions
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  process:
    name: Call process-cancel-resolutions
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: POST process-cancel-resolutions
        env:
          CANCEL_RESOLUTION_CRON_SECRET: ${{ secrets.CANCEL_RESOLUTION_CRON_SECRET }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          BOOKING_REMINDER_CRON_SECRET: ${{ secrets.BOOKING_REMINDER_CRON_SECRET }}
          FUNCTION_URL: https://xcopqllkulxfkpunetbc.supabase.co/functions/v1/process-cancel-resolutions
        run: |
          set -euo pipefail
          SECRET="${CANCEL_RESOLUTION_CRON_SECRET:-${CRON_SECRET:-${BOOKING_REMINDER_CRON_SECRET:-}}}"
          if [ -z "${SECRET}" ]; then
            echo "::error::Set CANCEL_RESOLUTION_CRON_SECRET, CRON_SECRET, or BOOKING_REMINDER_CRON_SECRET in GitHub Actions secrets."
            exit 1
          fi

          HTTP_CODE="$(curl -sS -o /tmp/process-cancel-resolutions.json -w '%{http_code}' \
            --connect-timeout 15 \
            --max-time 120 \
            -X POST "${FUNCTION_URL}" \
            -H "Authorization: Bearer ${SECRET}" \
            -H "Content-Type: application/json" \
            -d '{"limit":50}')"

          echo "HTTP status: ${HTTP_CODE}"
          cat /tmp/process-cancel-resolutions.json || true
          echo

          case "${HTTP_CODE}" in
            2??)
              echo "process-cancel-resolutions succeeded."
              ;;
            *)
              echo "::error::process-cancel-resolutions failed with HTTP ${HTTP_CODE}"
              exit 1
              ;;
          esac
