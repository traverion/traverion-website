# Manual second caller for the delivery worker.
#
# The recurring worker is the database job deliver-transactional-email.
# This workflow is not on a schedule: this account cannot write Actions
# secrets, and a scheduled run without EMAIL_DELIVERY_CRON_SECRET would fail.
#
# Admin action, once, if a GitHub caller is also wanted:
# 1. Settings → Secrets and variables → Actions → add EMAIL_DELIVERY_CRON_SECRET
#    with the same value as the Edge Function secret of that name.
# 2. Actions → Deliver transactional email → Run workflow on main.
# 3. After that run succeeds, add `schedule: cron '*/5 * * * *'` back.
#
# Auth is that one secret. Other cron secrets are not accepted.

name: Deliver transactional email

on:
  workflow_dispatch:

concurrency:
  group: deliver-transactional-email
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deliver:
    name: Call deliver-transactional-email
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: POST deliver-transactional-email
        env:
          EMAIL_DELIVERY_CRON_SECRET: ${{ secrets.EMAIL_DELIVERY_CRON_SECRET }}
          FUNCTION_URL: https://xcopqllkulxfkpunetbc.supabase.co/functions/v1/deliver-transactional-email
        run: |
          set -euo pipefail
          if [ -z "${EMAIL_DELIVERY_CRON_SECRET}" ]; then
            echo "::error::Set the EMAIL_DELIVERY_CRON_SECRET Actions secret to the Edge Function secret of the same name."
            exit 1
          fi

          HTTP_CODE="$(curl -sS -o /tmp/deliver-transactional-email.json -w '%{http_code}' \
            --connect-timeout 15 \
            --max-time 120 \
            -X POST "${FUNCTION_URL}" \
            -H "Authorization: Bearer ${EMAIL_DELIVERY_CRON_SECRET}" \
            -H "Content-Type: application/json" \
            -d '{"limit":20}')"

          echo "HTTP status: ${HTTP_CODE}"
          python3 - <<'PY'
          import json
          try:
              body = json.load(open("/tmp/deliver-transactional-email.json"))
          except Exception:
              print("response was not json")
              raise SystemExit(0)
          print(json.dumps({
              "success": body.get("success"),
              "claimed": body.get("claimed"),
              "sent": body.get("sent"),
              "failed": body.get("failed"),
          }))
          PY

          case "${HTTP_CODE}" in
            2??)
              echo "deliver-transactional-email succeeded."
              ;;
            *)
              echo "::error::deliver-transactional-email failed with HTTP ${HTTP_CODE}"
              exit 1
              ;;
          esac
